<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>승선확인서</title>
    <link rel="stylesheet" href="/css/reset.css">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.blue.min.css"> -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/base-min.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <template id="b-back">
        <span class="back"><i-back></i-back></span>
    </template>
    <template id="b-edit">
        <div class="badge jade"><i-edit></i-edit></div>
    </template>
    <template id="b-delete">
        <div class="badge red"><i-delete></i-delete></div>
    </template>
    <template id="i-paper">
        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="currentColor"  class="icon icon-tabler icons-tabler-filled icon-tabler-clipboard-text"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17.997 4.17a3 3 0 0 1 2.003 2.83v12a3 3 0 0 1 -3 3h-10a3 3 0 0 1 -3 -3v-12a3 3 0 0 1 2.003 -2.83a4 4 0 0 0 3.997 3.83h4a4 4 0 0 0 3.98 -3.597zm-2.997 10.83h-6a1 1 0 0 0 0 2h6a1 1 0 0 0 0 -2m0 -4h-6a1 1 0 0 0 0 2h6a1 1 0 0 0 0 -2m-1 -9a2 2 0 1 1 0 4h-4a2 2 0 1 1 0 -4z" /></svg>
    </template>
    <template id="i-time">
        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="currentColor"  class="icon icon-tabler icons-tabler-filled icon-tabler-alarm"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M16 6.072a8 8 0 1 1 -11.995 7.213l-.005 -.285l.005 -.285a8 8 0 0 1 11.995 -6.643zm-4 2.928a1 1 0 0 0 -1 1v3l.007 .117a1 1 0 0 0 .993 .883h2l.117 -.007a1 1 0 0 0 .883 -.993l-.007 -.117a1 1 0 0 0 -.993 -.883h-1v-2l-.007 -.117a1 1 0 0 0 -.993 -.883z" /><path d="M6.412 3.191a1 1 0 0 1 1.273 1.539l-.097 .08l-2.75 2a1 1 0 0 1 -1.273 -1.54l.097 -.08l2.75 -2z" /><path d="M16.191 3.412a1 1 0 0 1 1.291 -.288l.106 .067l2.75 2a1 1 0 0 1 -1.07 1.685l-.106 -.067l-2.75 -2a1 1 0 0 1 -.22 -1.397z" /></svg>
    </template>
    <template id="i-back">
        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-left"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>
    </template>
    <template id="i-edit">
        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-edit"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1" /><path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z" /><path d="M16 5l3 3" /></svg>
    </template>
    <template id="i-delete">
        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-trash-x"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7h16" /><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" /><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" /><path d="M10 12l4 4m0 -4l-4 4" /></svg>
    </template>
    <template id="i-night">
        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="currentColor"  class="icon icon-tabler icons-tabler-filled icon-tabler-moon"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 1.992a10 10 0 1 0 9.236 13.838c.341 -.82 -.476 -1.644 -1.298 -1.31a6.5 6.5 0 0 1 -6.864 -10.787l.077 -.08c.551 -.63 .113 -1.653 -.758 -1.653h-.266l-.068 -.006l-.06 -.002z" /></svg>
    </template>
    <template id="i-male">
        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-gender-male"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 14m-5 0a5 5 0 1 0 10 0a5 5 0 1 0 -10 0" /><path d="M19 5l-5.4 5.4" /><path d="M19 5h-5" /><path d="M19 5v5" /></svg>
    </template>
    <template id="i-female">
        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-gender-female"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 9m-5 0a5 5 0 1 0 10 0a5 5 0 1 0 -10 0" /><path d="M12 14v7" /><path d="M9 18h6" /></svg>
    </template>
    <template id="i-add">
        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-plus"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>
    </template>
    <template id="i-check">
        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-check"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l5 5l10 -10" /></svg>
    </template>
    <header>
        <h1 data-i18n="header"></h1>
    </header>
    <main>
        <section id="sectionA" hidden>
            <div class="greet">
                <div class="title" data-i18n="title"></div>
                <div class="subtitle" data-i18n="subtitle"></div>
            </div>
            <hr>
            <br>
            <div class="grid2">
                <div id="item1" class="service-item selected">
                    <img src="https://picsum.photos/id/1/300/200" />
                    <p>BALI 4.3</p>
                </div>
                <div id="item2" class="service-item">
                    <img src="https://picsum.photos/id/2/300/200" />
                    <p>BALI 5.4</p>
                </div>
            </div>
            <h3><i-paper></i-paper><span data-i18n="services"></span></h3>
            <div class="hbox">
                <button type="button" id="btn-private" class="selected" data-i18n="private"></button>
                <button type="button" id="btn-public" data-i18n="public"></button>
            </div>

            <h3><i-time></i-time><span data-i18n="hours"></span></h3>
            <div class="hbox">
                <input type="date" id="date" />
                <select id="time">
                    <option value="09:00">09:00</option>
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="12:00">12:00</option>
                    <option value="12:30">12:30</option>
                    <option value="13:00">13:00</option>
                    <option value="13:30">13:30</option>
                    <option value="14:00">14:00</option>
                    <option value="14:30">14:30</option>
                    <option value="15:00">15:00</option>
                    <option value="15:30">15:30</option>
                    <option value="16:00">16:00</option>
                    <option value="16:30">16:30</option>
                    <option value="17:00">17:00</option>
                    <option value="17:30">17:30</option>
                    <option value="18:00">18:00</option>
                    <option value="18:30">18:30</option>
                    <option value="19:00">19:00</option>
                    <option value="19:30">19:30</option>
                    <option value="20:00">20:00</option>
                    <option value="20:30">20:30</option>
                    <option value="21:00">21:00</option>
                    <option value="21:30">21:30</option>
                    <option value="22:00">22:00</option>
                    <option value="22:30">22:30</option>
                    <option value="23:00">23:00</option>
                </select>
            </div>
            <br>
            <button class="next primary" data-i18n="next"></button>
        </section>
        <section id="sectionB" hidden>
            <h3><b-back></b-back><span data-i18n="terms"></span></h3>
            <hr>
            <div class="term-list">
                <ul>
                    <li><span data-i18n="term1"></span></li>
                    <li><span data-i18n="term2"></span></li>
                    <li><span data-i18n="term3"></span></li>
                    <li><span data-i18n="term4"></span></li>
                    <li><span data-i18n="term5"></span></li>
                    <li><span data-i18n="term6"></span></li>
                    <li><span data-i18n="term7"></span></li>
                </ul>
            </div>
            <br>
            <div class="agreement" data-i18n="agreement"></div>
            <br>
            <button class="next primary" data-i18n="agree"></button>
        </section>
        <section id="sectionC" hidden>
            <section id="section1" hidden>
                <h3><b-back></b-back><span data-i18n="reporting"></span></h3>
                <hr>
                <h3><i-paper></i-paper><span data-i18n="name"></span></h3>
                <input type="text" id="name-input" placeholder="실명을 입력하세요" />
                <br><br>
                <button class="next primary" disabled data-i18n="next"></button>
            </section>
            <section id="section2" hidden>
                <h3><b-back></b-back><span data-i18n="reporting"></span></h3>
                <hr>
                <h3><i-paper></i-paper><span data-i18n="birth"></span></h3>
                <input type="text" id="birth-input" placeholder="숫자만 입력하세요" inputmode="numeric" pattern="\d*" />
                <div class="desc" data-i18n="birth-ex"></div>
                <br>
                <button class="next primary" disabled data-i18n="next"></button>
            </section>
            <section id="section3" hidden>
                <h3><b-back></b-back><span data-i18n="reporting"></span></h3>
                <hr>
                <h3><i-paper></i-paper><span data-i18n="phone"></span></h3>
                <br>
                <input type="text" id="phone-input" placeholder="숫자만 입력하세요" inputmode="numeric" pattern="\d*" />
                <br><br>
                <label><input type="checkbox" id="no-phone-checkbox" /><span data-i18n="no-phone"></span></label>
                <br><br>
                <button class="next primary" disabled data-i18n="next"></button>
            </section>
            <section id="section4" hidden>
                <h3><b-back></b-back><span data-i18n="reporting"></span></h3>
                <hr>
                <h3><i-paper></i-paper><span data-i18n="gender"></span></h3>
                <div class="hbox">
                    <button type="button" id="male"><i-male></i-male><span data-i18n="male"></span></button>
                    <button type="button" id="female"><i-female></i-female><span data-i18n="female"></span></button>
                </div>
            </section>
            <section id="section5" hidden>
                <h3><b-back></b-back><span data-i18n="reporting"></span></h3>
                <hr>
                <h3><i-paper></i-paper><span data-i18n="add-or-submit"></span></h3>
                <div class="hbox">
                    <button type="button" id="add" class="final-btn">
                        <div class="circle"><i-add></i-add></div>
                        <div class="title" data-i18n="add"></div>
                        <div class="subtitle" data-i18n="add-text"></div>
                    </button>
                    <button type="button" id="submit" class="final-btn">
                        <div class="circle"><i-check></i-check></div>
                        <div class="title" data-i18n="submit"></div>
                        <div class="subtitle"><span data-i18n="submit-text1"></span><br><span data-i18n="submit-text2"></span></div>
                    </button>
                </div>
                <h3><i-paper></i-paper><span data-i18n="list"></span></h3>
                <table class="round">
                    <thead>
                        <tr>
                            <th data-i18n="name"></th>
                            <th data-i18n="birth"></th>
                            <th data-i18n="gender"></th>
                            <th data-i18n="phone"></th>
                            <th data-i18n="edit"></th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </section>
            <div class="privacy" data-i18n="privacy"></div>
        </section>
        <section id="popupA" class="popup" hidden>
            <div class="popup-content">
                <h3 class="center"><i-paper></i-paper><span data-i18n="edit-member"></span></h3>
                <hr>
                <table class="none">
                    <tbody>
                        <tr>
                            <td data-i18n="name"></td>
                            <td><input type="text" id="edit-name-input" placeholder="실명을 입력하세요" /></td>
                        </tr>
                        <tr>
                            <td data-i18n="birth"></td>
                            <td>
                                <input type="text" id="edit-birth-input" placeholder="숫자만 입력하세요" inputmode="numeric" pattern="\d*" />
                            </td>
                        </tr>
                        <tr>
                            <td data-i18n="gender"></td>
                            <td><div class="hbox">
                                <button type="button" id="edit-male" data-i18n="male"></button>
                                <button type="button" id="edit-female" data-i18n="female"></button>
                            </div></td>
                        </tr>
                        <tr>
                            <td data-i18n="phone"></td>
                            <td>
                                <input type="text" id="edit-phone-input" placeholder="숫자만 입력하세요" inputmode="numeric" pattern="\d*" />
                            </td>
                        </tr>
                    </tbody>
                </table>
                <hr>
                <div class="hbox">
                    <button type="button" id="btn-edit-cancel" class="secondary" data-i18n="cancel"></button>
                    <button type="button" id="btn-edit-apply" class="primary" data-i18n="apply"></button>
                </div>
            </div>
        </section>
        <section id="sectionD" hidden>
            <div class="finished">
                <h2 data-i18n="finished"></h2>
                <h3 data-i18n="thanks"></h3>
            </div>
        </section>
    </main>
    <script type="module" src="/js/common/languages.js"></script>
    <script type="module" src="/js/common/template.js"></script>
    <script type="module" src="/js/common/datetime.js"></script>
    <script type="module" src="/js/report/navigation.js"></script>
    <script type="module" src="/js/report/build.js"></script>
    <script type="module" src="/js/report/build_late.js"></script>
</body>
</html>
